$kind: http-request
name: 'Get SMS List - With Filters'
method: GET
url: '{{base_url}}/api/sms'
order: 2000
queryParams:
  - key: search
    value: hello
  - key: per_page
    value: '5'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("meta.per_page equals 5", function () {
        const json = pm.response.json();
        pm.expect(json.meta.per_page).to.equal(5);
      });

      pm.test("data is an array", function () {
        const json = pm.response.json();
        pm.expect(json.data).to.be.an("array");
      });
